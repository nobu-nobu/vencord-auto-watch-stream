      <rect x="42" y="153" width="182" height="12" rx="6" fill="#4e5058"/><rect x="42" y="178" width="148" height="10" rx="5" fill="#4e5058"/><rect x="42" y="205" width="206" height="10" rx="5" fill="#4e5058"/>
