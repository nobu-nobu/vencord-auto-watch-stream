<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <rect width="1200" height="620" rx="28" fill="#111214"/>
  <text x="64" y="78" fill="#f2f3f5" font-family="Segoe UI, Noto Sans JP, sans-serif" font-size="38" font-weight="700">AutoWatchStream を使うまで</text>
  <text x="64" y="116" fill="#b5bac1" font-family="Segoe UI, Noto Sans JP, sans-serif" font-size="20">Vencordをソースからビルドしたあと、Discordでプラグインを有効にします</text>
  <g font-family="Segoe UI, Noto Sans JP, sans-serif">
    <g transform="translate(64 164)">
      <rect width="328" height="370" rx="22" fill="#1e1f22" stroke="#35363c" stroke-width="2"/>
      <circle cx="48" cy="48" r="25" fill="#5865f2"/><text x="48" y="57" text-anchor="middle" fill="white" font-size="26" font-weight="700">1</text>
      <text x="30" y="112" fill="#f2f3f5" font-size="25" font-weight="700">ファイルを追加</text>
      <rect x="30" y="145" width="268" height="112" rx="10" fill="#111214"/>
      <text x="46" y="177" fill="#b5bac1" font-size="15">Vencord/</text>
      <text x="62" y="207" fill="#b5bac1" font-size="15">src/userplugins/</text>
      <text x="78" y="237" fill="#23a559" font-size="15" font-weight="700">autoWatchStream/index.ts</text>
      <text x="30" y="305" fill="#dbdee1" font-size="18">このリポジトリを</text>
      <text x="30" y="333" fill="#dbdee1" font-size="18">上の場所へcloneします</text>
    </g>
    <path d="M414 350h40" stroke="#5865f2" stroke-width="8" stroke-linecap="round"/><path d="m444 335 18 15-18 15" fill="none" stroke="#5865f2" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(436 164)">
      <rect width="328" height="370" rx="22" fill="#1e1f22" stroke="#35363c" stroke-width="2"/>
      <circle cx="48" cy="48" r="25" fill="#5865f2"/><text x="48" y="57" text-anchor="middle" fill="white" font-size="26" font-weight="700">2</text>
      <text x="30" y="112" fill="#f2f3f5" font-size="25" font-weight="700">ビルドして導入</text>
      <rect x="30" y="145" width="268" height="136" rx="10" fill="#111214"/>
      <text x="46" y="180" fill="#23a559" font-family="Consolas, monospace" font-size="15">pnpm install</text>
      <text x="46" y="215" fill="#23a559" font-family="Consolas, monospace" font-size="15">pnpm build --disable-updater</text>
      <text x="46" y="250" fill="#23a559" font-family="Consolas, monospace" font-size="15">pnpm inject</text>
      <text x="30" y="329" fill="#dbdee1" font-size="18">完了したらDiscordを</text>
      <text x="30" y="357" fill="#dbdee1" font-size="18">完全終了して再起動</text>
    </g>
    <path d="M786 350h40" stroke="#5865f2" stroke-width="8" stroke-linecap="round"/><path d="m816 335 18 15-18 15" fill="none" stroke="#5865f2" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(808 164)">
      <rect width="328" height="370" rx="22" fill="#1e1f22" stroke="#35363c" stroke-width="2"/>
      <circle cx="48" cy="48" r="25" fill="#5865f2"/><text x="48" y="57" text-anchor="middle" fill="white" font-size="26" font-weight="700">3</text>
      <text x="30" y="112" fill="#f2f3f5" font-size="25" font-weight="700">DiscordでON</text>
      <rect x="30" y="145" width="268" height="92" rx="12" fill="#2b2d31"/>
      <text x="48" y="180" fill="#f2f3f5" font-size="18" font-weight="700">AutoWatchStream</text>
      <text x="48" y="211" fill="#b5bac1" font-size="14">Plugins 内で有効化</text>
      <rect x="235" y="169" width="45" height="26" rx="13" fill="#23a559"/><circle cx="266" cy="182" r="10" fill="white"/>
      <text x="30" y="286" fill="#dbdee1" font-size="17">ユーザー設定 → Plugins</text>
      <text x="30" y="317" fill="#dbdee1" font-size="17">→ AutoWatchStream</text>
      <text x="30" y="355" fill="#b5bac1" font-size="15">歯車から表示モードを選択</text>
    </g>
  </g>
</svg>
